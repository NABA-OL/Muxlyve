<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Muxlyve</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    /* Negro puro, no el gris de marca (#0d1117) — el shader dibuja un quad que cubre
       TODO el canvas, así que donde el fundido da 0 el resultado siempre es negro puro
       (0,0,0), pase lo que pase con clearColor. En vez de perseguir que el fondo de la
       ventana IGUALE ese negro con trucos (blend mode, gestión de color), más simple:
       que el fondo de la ventana SEA ese mismo negro. Cero diferencia posible. */
    background: #000000;
    display: flex; align-items: flex-start; justify-content: center;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #e6edf3;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
    transition: opacity .32s ease;
    position: relative; /* ancla al canvas de fondo, ver .splash-bg-canvas */
    padding-top: 4%; /* ícono+título pegados arriba, no centrado — deja el resto libre para el shader */
  }
  /* Fondo "prisma" (mismo shader que el modal Acerca de, ver hero-bg.js) — el canvas
     ocupa TODA la ventana, un solo render continuo de punta a punta, sin recortar ni
     enmascarar por CSS. Lo que empuja el brillo hacia abajo es el propio shader: yOffset
     corre el centro de la onda hacia abajo DENTRO del cálculo (ver hero-bg.js) — el
     título nunca compite con el brillo porque nunca hay una onda ahí arriba. Sin
     mix-blend-mode a propósito (se probó, daba un aspecto gris/lavado feo) — con el
     fondo de la ventana en negro puro (ver html,body de arriba) no hace falta ningún
     truco de mezcla para que la parte apagada del shader se funda con el fondo: los dos
     son negro puro, el mismo píxel exacto. */
  .splash-bg-canvas {
    position: absolute; inset: 0;
    display: block; width: 100%; height: 100%;
    z-index: 0;
    opacity: 0; /* arranca invisible, hace fade-in solo cuando el shader ya está listo (ver script abajo) — nada de aparecer de golpe a medio cargar */
    transition: opacity .6s ease;
  }
  .splash-bg-canvas.ready { opacity: 1; }
  .container {
    display: flex; flex-direction: column;
    align-items: center;
    position: relative; z-index: 1; /* por encima del canvas de fondo */
  }
  @keyframes pop-in {
    from { opacity: 0; transform: scale(.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* Foto de perfil — solo aparece si electron/main.js mandó ?avatarUrl= (ver script
     abajo), mismo criterio que .greeting: sin foto, el elemento queda oculto y sin
     espacio, no hay placeholder feo de "sin imagen". */
  .avatar {
    display: none;
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover;
    margin-bottom: 22px;
    animation: pop-in .55s .65s cubic-bezier(.22,1,.36,1) both;
  }
  /* Wordmark letra por letra — "Muxlyve" aparece de a una en vez de un solo fade del
     bloque completo. Cada <span> anima con su propio delay (ver estilos inline abajo);
     el color acento arranca en la "v" de "ve", igual que en el resto de la app. */
  .wordmark {
    display: flex;
    font-size: 2.72rem; font-weight: 700; letter-spacing: -.03em;
    margin-bottom: 38px;
  }
  .letter {
    display: inline-block;
    opacity: 0;
    animation: letter-pop .5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes letter-pop {
    from { opacity: 0; transform: translateY(6px) scale(.75); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .accent { color: #7c5cff; }
  /* Saludo con nickname — solo aparece si electron/main.js mandó ?nickname= (ver script
     abajo). Sin nickname el elemento queda vacío y con display:none, cero espacio. */
  .greeting {
    display: none;
    /* Escalado proporcional (.78rem * ~1.47 ≈ 1.15rem) + 10px más encima, a pedido. */
    font-size: 1.77rem; color: #8b949e; letter-spacing: .02em;
    margin-bottom: 26px;
    animation: fade-in .4s .5s ease both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Envoltorio aparte del círculo: fade-in y giro animan "transform" cada uno, si
     estuvieran en el mismo elemento se pisarían entre sí (solo gana el último). */
  .spinner-wrap {
    margin-bottom: 6px;
    animation: fade-in .4s .82s ease both;
  }
  .spinner {
    width: 29px; height: 29px;
    border-radius: 50%;
    /* "Gotica" con rastro: gradiente cónico que va de transparente a morado sólido —
       al girar, la parte sólida se ve como la cabeza y el degradado detrás como la
       cola que se desvanece, en vez de un arco fijo (como antes con border-top-color). */
    background: conic-gradient(from 0deg, transparent 0%, #7c5cff 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
    animation: spin .8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<canvas id="splashBgCanvas" class="splash-bg-canvas" aria-hidden="true"></canvas>
<div class="container">
  <div class="wordmark" aria-label="Muxlyve">
    <span class="letter" style="animation-delay:.00s">M</span>
    <span class="letter" style="animation-delay:.05s">u</span>
    <span class="letter" style="animation-delay:.10s">x</span>
    <span class="letter" style="animation-delay:.15s">l</span>
    <span class="letter" style="animation-delay:.20s">y</span>
    <span class="letter accent" style="animation-delay:.25s">v</span>
    <span class="letter accent" style="animation-delay:.30s">e</span>
  </div>
  <div class="greeting" id="greeting"></div>
  <img class="avatar" id="splashAvatar" src="" alt="">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>
<script>
window.finishLoad = function() {
  // Sin barra que completar — el círculo gira hasta que el body se desvanece.
  setTimeout(function() { document.body.style.opacity = '0'; }, 650);
};

(function() {
  var params = new URLSearchParams(window.location.search);
  var nickname = params.get('nickname');
  if (nickname) {
    var el = document.getElementById('greeting');
    el.textContent = '¡Hola, ' + nickname + '!';
    el.style.display = 'block';
  }
  var avatarUrl = params.get('avatarUrl');
  if (avatarUrl) {
    var img = document.getElementById('splashAvatar');
    // Cache-buster: el backend sobrescribe el mismo blob al cambiar de foto, la URL no
    // cambia — sin esto Electron podía servir la versión vieja desde su caché de disco
    // entre arranques aunque la foto ya se hubiera actualizado.
    img.src = avatarUrl + (avatarUrl.indexOf('?') !== -1 ? '&' : '?') + '_=' + Date.now();
    img.style.display = 'block';
  }
})();
</script>
<script type="module">
  // Import relativo a este archivo (../src/public/hero-bg.js) — el splash carga por
  // file://, no por HTTP como el panel, mismo motivo que el fix de ruta adentro de
  // hero-bg.js (ver el comentario ahí). Si falla (WebGL no disponible, archivo
  // faltante en un build raro) el splash se ve igual, solo sin el fondo — no es crítico.
  import('../src/public/hero-bg.js')
    .then(({ initHeroBG }) => {
      const canvas = document.getElementById('splashBgCanvas');
      initHeroBG(canvas, { yOffset: -0.25, fadeStart: 0.40, fadeEnd: 0.94 });
      requestAnimationFrame(() => canvas.classList.add('ready'));
    })
    .catch(() => {});
</script>
</body>
</html>
