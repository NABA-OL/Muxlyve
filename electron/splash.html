<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Muxlyve</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    /* Negro puro, no el gris de marca (#0d1117) — el shader dibuja un quad que cubre
       TODO el canvas, así que donde el fundido da 0 el resultado siempre es negro puro
       (0,0,0), pase lo que pase con clearColor. En vez de perseguir que el fondo de la
       ventana IGUALE ese negro con trucos (blend mode, gestión de color), más simple:
       que el fondo de la ventana SEA ese mismo negro. Cero diferencia posible. */
    background: #000000;
    display: flex; align-items: flex-start; justify-content: center;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #e6edf3;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
    transition: opacity .32s ease;
    position: relative; /* ancla al canvas de fondo, ver .splash-bg-canvas */
    padding-top: 4%; /* ícono+título pegados arriba, no centrado — deja el resto libre para el shader */
  }
  /* Fondo "prisma" (mismo shader que el modal Acerca de, ver hero-bg.js) — el canvas
     ocupa TODA la ventana, un solo render continuo de punta a punta, sin recortar ni
     enmascarar por CSS. Lo que empuja el brillo hacia abajo es el propio shader: yOffset
     corre el centro de la onda hacia abajo DENTRO del cálculo (ver hero-bg.js) — el
     título nunca compite con el brillo porque nunca hay una onda ahí arriba. Sin
     mix-blend-mode a propósito (se probó, daba un aspecto gris/lavado feo) — con el
     fondo de la ventana en negro puro (ver html,body de arriba) no hace falta ningún
     truco de mezcla para que la parte apagada del shader se funda con el fondo: los dos
     son negro puro, el mismo píxel exacto. */
  .splash-bg-canvas {
    position: absolute; inset: 0;
    display: block; width: 100%; height: 100%;
    z-index: 0;
    opacity: 0; /* arranca invisible, hace fade-in solo cuando el shader ya está listo (ver script abajo) — nada de aparecer de golpe a medio cargar */
    transition: opacity .6s ease;
  }
  .splash-bg-canvas.ready { opacity: 1; }
  .container {
    display: flex; flex-direction: column;
    align-items: center;
    position: relative; z-index: 1; /* por encima del canvas de fondo */
  }
  .icon {
    width: 72px; height: 72px;
    margin-bottom: 18px;
    animation: pop-in .55s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: scale(.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* Wordmark letra por letra — "Muxlyve" aparece de a una en vez de un solo fade del
     bloque completo. Cada <span> anima con su propio delay (ver estilos inline abajo);
     el color acento arranca en la "v" de "ve", igual que en el resto de la app. */
  .wordmark {
    display: flex;
    font-size: 1.85rem; font-weight: 700; letter-spacing: -.03em;
    margin-bottom: 26px;
  }
  .letter {
    display: inline-block;
    opacity: 0;
    animation: letter-pop .5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes letter-pop {
    from { opacity: 0; transform: translateY(6px) scale(.75); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .accent { color: #7c5cff; }
  .track {
    width: 160px; height: 2px;
    background: #1e2635; border-radius: 1px;
    overflow: hidden; margin-bottom: 14px;
    animation: fade-in .4s .82s ease both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .bar {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #7c5cff, #4da3ff);
    border-radius: 1px;
    /* Arranca junto con .track (mismo delay) — sin esto la barra ya viene corriendo
       tiempo invisible mientras .track todavía está en fade-in, y se ve "adelantada"
       apenas se hace visible. Duración estirada (2s -> 3.2s): se sentía apurada —
       window.finishLoad() la corta a 100% igual apenas el motor real avisa que está
       listo, así que estirarla no atrasa un arranque rápido. */
    animation: load-init 3.2s .82s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes load-init {
    0%   { width: 0%; }
    35%  { width: 32%; }
    70%  { width: 47%; }
    100% { width: 57%; }
  }
  .status {
    font-size: .72rem; color: #8b949e; letter-spacing: .05em;
    text-transform: uppercase;
    animation: fade-in .4s .87s ease both;
  }
  .version {
    font-size: .65rem; color: #4d5563; letter-spacing: .03em;
    margin-top: 9px;
    font-family: ui-monospace, monospace;
    animation: fade-in .4s .92s ease both;
  }
</style>
</head>
<body>
<canvas id="splashBgCanvas" class="splash-bg-canvas" aria-hidden="true"></canvas>
<div class="container">
  <img src="../src/public/icon-muxlyve.svg" class="icon" alt="">
  <div class="wordmark" aria-label="Muxlyve">
    <span class="letter" style="animation-delay:.00s">M</span>
    <span class="letter" style="animation-delay:.05s">u</span>
    <span class="letter" style="animation-delay:.10s">x</span>
    <span class="letter" style="animation-delay:.15s">l</span>
    <span class="letter" style="animation-delay:.20s">y</span>
    <span class="letter accent" style="animation-delay:.25s">v</span>
    <span class="letter accent" style="animation-delay:.30s">e</span>
  </div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Iniciando motor…</div>
  <div class="version" id="version"></div>
</div>
<script>
window.finishLoad = function() {
  var bar    = document.getElementById('bar');
  var status = document.getElementById('status');
  if (!bar) return;
  // Freeze bar at current computed width, then transition to 100%
  var w = getComputedStyle(bar).width;
  bar.style.animation = 'none';
  bar.style.width = w;
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      bar.style.transition = 'width .5s cubic-bezier(.22,1,.36,1)';
      bar.style.width = '100%';
    });
  });

  var urlParams = new URLSearchParams(window.location.search);
  var lang = urlParams.get('lang') || 'en';
  if (status) status.textContent = lang === 'es' ? 'Listo' : 'Ready';

  // Fade body after bar completes + brief hold
  setTimeout(function() { document.body.style.opacity = '0'; }, 650);
};

// Auto-translate initial text + versión (electron/main.js pasa ?version= con app.getVersion())
(function() {
  var urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('lang') === 'en') {
    document.getElementById('status').textContent = 'Starting engine…';
  }
  var version = urlParams.get('version');
  var versionEl = document.getElementById('version');
  if (version && versionEl) versionEl.textContent = 'v' + version;
})();
</script>
<script type="module">
  // Import relativo a este archivo (../src/public/hero-bg.js) — el splash carga por
  // file://, no por HTTP como el panel, mismo motivo que el fix de ruta adentro de
  // hero-bg.js (ver el comentario ahí). Si falla (WebGL no disponible, archivo
  // faltante en un build raro) el splash se ve igual, solo sin el fondo — no es crítico.
  import('../src/public/hero-bg.js')
    .then(({ initHeroBG }) => {
      const canvas = document.getElementById('splashBgCanvas');
      initHeroBG(canvas, { yOffset: -0.25, fadeStart: 0.40, fadeEnd: 0.94 });
      requestAnimationFrame(() => canvas.classList.add('ready'));
    })
    .catch(() => {});
</script>
</body>
</html>
